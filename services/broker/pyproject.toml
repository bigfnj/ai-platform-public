[project]
name = "platform-broker"
version = "0.0.1"
description = "GPU / Model Broker — the single owner of the GPU for the platform."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    # Not imported by name anywhere: FastAPI needs it to register the Form/UploadFile routes
    # (openai_compat's /audio/transcriptions), and raises at IMPORT time without it, so a
    # broker missing it never starts. It was undeclared and present only by hand-install.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev =["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
