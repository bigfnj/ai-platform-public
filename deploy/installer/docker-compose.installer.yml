# Lean installer stack: the bundled gateway (frontends baked in) + the two installable rail
# backends + caddy. No dist bind-mounts (the gateway image carries them), no host Node.
# recipe-book is behind a profile so it only comes up when the chooser selected it.
#
# The installer runs this from deploy/ with an explicit env file, e.g.:
#   docker compose --env-file .env -f installer/docker-compose.installer.yml [--profile recipe-book] up -d --build
#
# Build contexts are relative to THIS file (deploy/installer/), so ../.. is the repo root.
name: platform

services:
  terminal-fun:                  # local terminal games/toys + a broker-backed AI assistant
    build:
      context: ../../rails/terminal-fun
      dockerfile: deploy/Dockerfile
    image: terminal-fun-backend:latest
    environment:
      TERMINAL_FUN_BROKER_URL: http://host.docker.internal:11500
      BROKER_AUTH_TOKEN: ${BROKER_AUTH_TOKEN:-}   # broker control-plane token (deploy/.env)
      # Point at the @role, not a concrete name: that is what makes Admin -> Rails
      # authoritative for this rail. A pinned name here silently overrides the panel — the
      # admin repoints the role, the rail keeps using the pin, and nothing says so.
      TERMINAL_FUN_LLM_MODEL: ${TERMINAL_FUN_LLM_MODEL:-@terminal-fun}
    extra_hosts:
      - "host.docker.internal:${WINDOWS_HOST:-host-gateway}"
    tmpfs:
      - /tmp
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    expose:
      - "8730"
    restart: always

  recipe-book:                   # recipe + cocktail book (opt-in; ships with seed + baked icons)
    profiles: ["recipe-book"]
    build:
      context: ../../rails/recipe-book
      dockerfile: deploy/Dockerfile
    image: recipe-book-backend:latest
    environment:
      RECIPE_BOOK_DATA_DIR: /srv/var
      RECIPE_BOOK_BROKER_URL: http://host.docker.internal:11500
      BROKER_AUTH_TOKEN: ${BROKER_AUTH_TOKEN:-}   # broker control-plane token (deploy/.env)
      # The three Admin -> Rails managed slots point at their @roles so the panel is
      # authoritative. RECIPE_BOOK_LLM_MODEL stays a concrete pin on purpose: it is only a
      # defensive fallback for a chat() call with no model, every caller passes one, and it has
      # no role of its own (the generic @chat is shared with other rails and is not editable
      # from the Rails panel).
      RECIPE_BOOK_LLM_MODEL: ${RECIPE_BOOK_LLM_MODEL:-gemma3:4b}
      RECIPE_BOOK_ASSISTANT_MODEL: ${RECIPE_BOOK_ASSISTANT_MODEL:-@recipe}
      RECIPE_BOOK_VISION_MODEL: ${RECIPE_BOOK_VISION_MODEL:-@recipe-vision}
      RECIPE_BOOK_ICON_MODEL: ${RECIPE_BOOK_ICON_MODEL:-@recipe-icon}
      RECIPE_BOOK_EMBED_MODEL: ${RECIPE_BOOK_EMBED_MODEL:-@embed}
      RECIPE_BOOK_PRIMARY_USER: ${PLATFORM_ADMIN_USER:-admin}
    extra_hosts:
      - "host.docker.internal:${WINDOWS_HOST:-host-gateway}"
    volumes:
      - recipe_book_data:/srv/var
    expose:
      - "8830"
    restart: always

  co-worker:                     # Co-Worker — email/calendar intelligence inbox
    profiles: ["co-worker"]
    build:
      context: ../../rails/co-worker
      dockerfile: deploy/Dockerfile
    image: co-worker-backend:latest
    environment:
      CO_WORKER_INBOX_DIR: /data/inbox
      # Executive-brief synthesis calls the broker on the @co-worker-synthesis role.
      CO_WORKER_BROKER_URL: http://host.docker.internal:11500
      BROKER_AUTH_TOKEN: ${BROKER_AUTH_TOKEN:-}   # broker control-plane token (deploy/.env)
      # @role so Admin -> Rails can repoint the synthesis model like any other rail's.
      CO_WORKER_SYNTHESIS_MODEL: ${CO_WORKER_SYNTHESIS_MODEL:-@co-worker-synthesis}
    extra_hosts:
      - "host.docker.internal:${WINDOWS_HOST:-host-gateway}"
    volumes:
      # Bind-mount the Windows-side inbox so the co-work harvest process (running on the
      # host) can write files the container reads. Set CO_WORKER_INBOX_WIN to the Windows
      # path (e.g. C:\Users\you\ai-platform\data\co-worker\inbox); the installer converts
      # it to a WSL mount path automatically. Falls back to a named volume if unset.
      - ${CO_WORKER_INBOX_MOUNT:-co_worker_inbox}:/data/inbox
    expose:
      - "8860"
    restart: always

  smb-partner-enablement:        # SMB Partner Enablement — grounded RAG + Scenario Builder
    profiles: ["smb-partner-enablement"]
    build:
      context: ../../rails/smb-partner-enablement
      dockerfile: deploy/Dockerfile
    image: smb-partner-backend:latest
    environment:
      SMB_PARTNER_BROKER_URL: http://host.docker.internal:11500
      BROKER_AUTH_TOKEN: ${BROKER_AUTH_TOKEN:-}
      SMB_PARTNER_RAG_MODEL: ${SMB_PARTNER_RAG_MODEL:-@smb-partner-rag}
      SMB_PARTNER_EMBED_MODEL: ${SMB_PARTNER_EMBED_MODEL:-@embed}
      SMB_PARTNER_VOICE_BACKEND: ${SMB_PARTNER_VOICE_BACKEND:-auto}
      TZ: ${TZ:-America/Los_Angeles}
    extra_hosts:
      - "host.docker.internal:${WINDOWS_HOST:-host-gateway}"
    volumes:
      - smb_partner_data:/srv/var
    expose:
      - "8870"
    restart: always

  gemini-cx:                     # Gemini Enterprise CX — grounded RAG over a GECX corpus
    profiles: ["gemini-cx"]
    build:
      context: ../../rails/gemini-cx
      dockerfile: deploy/Dockerfile
    image: gemini-cx-backend:latest
    environment:
      GEMINI_CX_BROKER_URL: http://host.docker.internal:11500
      BROKER_AUTH_TOKEN: ${BROKER_AUTH_TOKEN:-}
      GEMINI_CX_RAG_MODEL: ${GEMINI_CX_RAG_MODEL:-@gemini-cx-rag}
      GEMINI_CX_EMBED_MODEL: ${GEMINI_CX_EMBED_MODEL:-@embed}
      # Read aloud: Kokoro-82M via the broker's tts_light (no GPU gate, no eviction).
      # 'auto' probes the broker's media worker and falls back to browser speech synthesis.
      GEMINI_CX_VOICE_BACKEND: ${GEMINI_CX_VOICE_BACKEND:-auto}
      GEMINI_CX_VOICE_SPEAKER: ${GEMINI_CX_VOICE_SPEAKER:-af_heart}
      TZ: ${TZ:-America/Los_Angeles}
    extra_hosts:
      - "host.docker.internal:${WINDOWS_HOST:-host-gateway}"
    volumes:
      - gemini_cx_data:/srv/var
    expose:
      - "8880"
    restart: always

  meeting-atlas:                 # Meeting Atlas — indexes Meetily recordings; no inference
    profiles: ["meeting-atlas"]
    build:
      context: ../../rails/meeting-atlas
      dockerfile: deploy/Dockerfile
    image: meeting-atlas-backend:latest
    environment:
      MEETING_ATLAS_RECORDINGS_DIR: /data/recordings
      MEETING_ATLAS_MEETILY_DB: ${MEETING_ATLAS_MEETILY_DB_IN_CONTAINER:-}
      MEETING_ATLAS_DISPLAY_TZ: ${TZ:-America/Los_Angeles}
      MEETING_ATLAS_AUTOREINDEX_SECONDS: ${MEETING_ATLAS_AUTOREINDEX_SECONDS:-300}
      TZ: ${TZ:-America/Los_Angeles}
    extra_hosts:
      - "host.docker.internal:${WINDOWS_HOST:-host-gateway}"
    volumes:
      # READ-ONLY. This is a 9p mount under Podman/Hyper-V and 9p rejects
      # rename-over-an-existing-file; the backend keeps its index in memory so it needs
      # no write path here. Falls back to an empty volume => an empty rail, not a crash.
      - ${MEETING_ATLAS_RECORDINGS_MOUNT:-meeting_atlas_recordings}:/data/recordings:ro
      - ${MEETING_ATLAS_MEETILY_DB_MOUNT:-meeting_atlas_db}:/data/meetily:ro
    expose:
      - "8740"
    restart: always

  gateway:                       # shell host + reverse proxy; frontends baked into the image
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.gateway.bundled
    image: platform-gateway-bundled:latest
    depends_on:
      - terminal-fun
    environment:
      PLATFORM_DB_URL: sqlite:////data/platform.db
      PLATFORM_ADMIN_USER: ${PLATFORM_ADMIN_USER:-admin}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      PLATFORM_ENABLED_APPS: ${PLATFORM_ENABLED_APPS:-terminal-fun}
      PLATFORM_COOKIE_SECURE: ${PLATFORM_COOKIE_SECURE:-false}
      PLATFORM_APP_CO_WORKER_URL: http://co-worker:8860
      PLATFORM_APP_SMB_PARTNER_ENABLEMENT_URL: http://smb-partner-enablement:8870
      PLATFORM_APP_GEMINI_CX_URL: http://gemini-cx:8880
      PLATFORM_APP_MEETING_ATLAS_URL: http://meeting-atlas:8740
    extra_hosts:
      - "host.docker.internal:${WINDOWS_HOST:-host-gateway}"
    volumes:
      - gateway_data:/data
    expose:
      - "8700"
    restart: always

  caddy:                         # front door on host :1111
    image: docker.io/library/caddy:2
    depends_on:
      - gateway
    ports:
      - "1111:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: always

# Declared external so a volume that already exists - restored from a backup, or carried across the
# Docker -> Podman migration - is adopted as-is instead of drawing "volume already exists but was not
# created by Docker Compose" on every single `up`.
#
# Two consequences, both deliberate:
#   * Compose does NOT apply the project prefix to an external volume, so `name:` is explicit.
#   * Compose does NOT create an external volume, so a missing one is an error rather than a silent
#     empty volume where the auth DB used to be. Initialize-ComposeVolumes (lib-runtime.ps1) creates
#     any that are missing before `up` runs, which is what makes a fresh install work.
volumes:
  recipe_book_data:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-platform}_recipe_book_data
  gateway_data:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-platform}_gateway_data
  co_worker_inbox:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-platform}_co_worker_inbox
  smb_partner_data:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-platform}_smb_partner_data
  meeting_atlas_recordings:  # fallback when MEETING_ATLAS_RECORDINGS_MOUNT is unset
  meeting_atlas_db:          # fallback when MEETING_ATLAS_MEETILY_DB_MOUNT is unset
  gemini_cx_data:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-platform}_gemini_cx_data
  caddy_data:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-platform}_caddy_data
  caddy_config:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-platform}_caddy_config
