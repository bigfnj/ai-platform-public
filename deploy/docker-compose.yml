# Platform hosting stack: the unified shell behind Caddy.
#
#   Browser ── Caddy (host :1111 -> :80, plain HTTP) ── gateway (shell SPA + auth + proxy)
#                                     ├─ /<rail>/api/* ─> that rail's backend service below
#                                     └─ model calls   ─> broker (NATIVE, host.docker.internal:11500)
#
# The GPU/media layer (broker + Ollama + the media and voice workers) stays NATIVE on Windows; the
# broker runs as the platform-broker service (deploy/install-services.ps1).
# Every frontend is built on the host and bind-mounted read-only into the gateway (its volumes,
# below): `npm run build` in apps/platform/frontend for the shell, and in each rail's frontend/
# (the gateway's volumes below give each one's exact path).
# Deploy ONE service at a time, from this folder, never a bare full-stack `up` (it recreates caddy,
# which rebinds host ports and churns the Windows NAT):
#   docker compose up -d --build --no-deps <service>     or     .\rebuild-stale.ps1
name: platform

services:
  recipe-book:                   # recipe-book backend (FastAPI over the recipe_book core; LLM + SDXL icons via broker)
    build:
      context: ../rails/recipe-book # uses recipe-book/deploy/Dockerfile
      dockerfile: deploy/Dockerfile
    image: recipe-book-backend:latest
    environment:
      RECIPE_BOOK_DATA_DIR: /srv/var
      RECIPE_BOOK_BROKER_URL: http://host.docker.internal:11500
      # Client ceiling must sit ABOVE the broker's own media_timeout (1200s), or the
      # client gives up first: the worker keeps running, the retry queues behind the
      # job still holding the GPU, and the broker's own 502 never reaches the caller.
      RECIPE_BOOK_BROKER_TIMEOUT: ${RECIPE_BOOK_BROKER_TIMEOUT:-1320}
      BROKER_AUTH_TOKEN: ${BROKER_AUTH_TOKEN:-}   # broker control-plane token (deploy/.env)
      # Size-scoped wildcard; the broker resolves it to the newest matching installed model.
      # The real culinary AI + the recipe-photo reader. Point at per-rail roles in deploy/.env
      # (@recipe / @recipe-vision) so Admin > Rails can repoint them live; defaults preserve
      # today's model (gemma3:27b) if unset.
      RECIPE_BOOK_ASSISTANT_MODEL: ${RECIPE_BOOK_ASSISTANT_MODEL:-@recipe}
      RECIPE_BOOK_VISION_MODEL: ${RECIPE_BOOK_VISION_MODEL:-@recipe-vision}
      # Per-recipe icon IMAGE model (media worker, not Ollama). Point at the @recipe-icon media
      # role in deploy/.env so Admin > Rails can switch sdxl-turbo <-> flux-schnell live.
      RECIPE_BOOK_ICON_MODEL: ${RECIPE_BOOK_ICON_MODEL:-@recipe-icon}
      # Semantic search's embedder. The lean installer passed it and this file did not, so
      # the full stack pinned the code's literal default while every other rail followed @embed.
      RECIPE_BOOK_EMBED_MODEL: ${RECIPE_BOOK_EMBED_MODEL:-@embed}
      # Multi-tenant: the platform user who inherits the pre-existing single-tenant data
      # (meal plan / pantry / bar) when per-user scoping goes live.
      RECIPE_BOOK_PRIMARY_USER: ${RECIPE_BOOK_PRIMARY_USER:-admin}
      # "Send to Phone": per-user Google Tasks. Set the shared OAuth *app* creds + redirect URI
      # and each user connects their own Google account in-app; blank = feature off (Connect
      # button hidden). One-time OAuth setup: rails/recipe-book/docs/GOOGLE_TASKS.md.
      RECIPE_BOOK_GTASKS_CLIENT_ID: ${RECIPE_BOOK_GTASKS_CLIENT_ID:-}
      RECIPE_BOOK_GTASKS_CLIENT_SECRET: ${RECIPE_BOOK_GTASKS_CLIENT_SECRET:-}
      # Must match the Web client's registered redirect URI, e.g.
      # https://platform.example.com/recipe-book/api/gtasks/callback
      RECIPE_BOOK_GTASKS_REDIRECT_URI: ${RECIPE_BOOK_GTASKS_REDIRECT_URI:-}
      RECIPE_BOOK_GTASKS_LIST_TITLE: ${RECIPE_BOOK_GTASKS_LIST_TITLE:-Shopping List}
      # Fernet key (deploy/.env) that encrypts stored Google refresh tokens at rest. Blank =
      # plaintext (legacy). Rotating it invalidates stored tokens (users re-connect).
      RECIPE_BOOK_TOKEN_KEY: ${RECIPE_BOOK_TOKEN_KEY:-}
    extra_hosts:
      - "host.docker.internal:${WINDOWS_HOST:-host-gateway}"
    volumes:
      - recipe_book_data:/srv/var  # recipe_book.db + recipes/ (markdown corpus) + icons/, seeded once from the host
    expose:
      - "8830"
    restart: always

  workstation:                   # browser-terminal backend — SSH client into the host.
    # INERT until you create ./workstation-keys with an SSH key + known_hosts and set
    # WORKSTATION_SSH_*. The gateway routes it by default (it is in the default rail list); to
    # keep this host-shell rail off entirely, name it in PLATFORM_DISABLED_APPS in deploy/.env.
    # Highest-privilege app (a shell on the host) — entitle it to yourself only.
    # See rails/workstation/README.md.
    build:
      context: ..
      dockerfile: deploy/Dockerfile.workstation
    image: workstation-backend:latest
    environment:
      WORKSTATION_SSH_HOST: ${WORKSTATION_SSH_HOST:-host.docker.internal}
      WORKSTATION_SSH_PORT: ${WORKSTATION_SSH_PORT:-22}
      WORKSTATION_SSH_USER: ${WORKSTATION_SSH_USER:-}
      WORKSTATION_SSH_KEY_PATH: /keys/id_workstation
      WORKSTATION_KNOWN_HOSTS_PATH: /keys/known_hosts
      WORKSTATION_INSECURE_SKIP_HOST_KEY_CHECK: ${WORKSTATION_INSECURE_SKIP_HOST_KEY_CHECK:-false}
      # Folder each preset starts in, as a path ON THE SSH TARGET (not in this container).
      # Empty = wherever the target's login shell lands. Also the folder the published
      # VS Code RemoteApp opens.
      WORKSTATION_START_DIR: ${WORKSTATION_START_DIR:-}
      WORKSTATION_AUDIT_DIR: /audit
      # RemoteApp (published desktop apps). RDP_HOST is the address the CLIENT dials —
      # this backend never speaks RDP, it only hands out an .rdp launcher. Unset =
      # feature off. Publish the app on the host first: deploy/install-remoteapp.ps1.
      WORKSTATION_RDP_HOST: ${WORKSTATION_RDP_HOST:-}
      WORKSTATION_RDP_PORT: ${WORKSTATION_RDP_PORT:-3389}
      WORKSTATION_RDP_USERNAME: ${WORKSTATION_RDP_USERNAME:-}
    extra_hosts:
      - "host.docker.internal:${WINDOWS_HOST:-host-gateway}"
    # Least-privilege (P1.4): non-root user (in the image), read-only rootfs, no new
    # privileges, all Linux capabilities dropped. Writable paths are the tmpfs + the
    # audit volume only. Shrinks the blast radius if this backend is ever compromised.
    read_only: true
    # /tmp is sized because an unsized tmpfs is bounded only by the VM's memory. Nothing here
    # writes it: the PTY runs on the SSH target and this backend only relays its bytes, writing its
    # audit file to /audit and nothing to disk, so 16m holds any incidental temp file and bounds
    # what a compromised backend can put in memory.
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    volumes:
      - "${WORKSTATION_KEYS_HOST:-./workstation-keys}:/keys:ro"
      - workstation_audit:/audit   # session audit log (rotated, retention-capped)
    expose:
      - "8720"
    restart: always

  terminal-fun:                  # Terminal Fun — local terminal games/toys + an AI assistant
    # (page Q&A + on-the-fly toy tuning) that talks to the platform broker. Games run as a
    # non-root PTY subprocess inside this container with an ephemeral per-session home on tmpfs.
    build:
      context: ../rails/terminal-fun
      dockerfile: deploy/Dockerfile
    image: terminal-fun-backend:latest
    environment:
      TERMINAL_FUN_BROKER_URL: http://host.docker.internal:11500
      BROKER_AUTH_TOKEN: ${BROKER_AUTH_TOKEN:-}   # broker control-plane token (deploy/.env)
      TERMINAL_FUN_LLM_MODEL: ${TERMINAL_FUN_LLM_MODEL:-@terminal-fun}
      TERMINAL_FUN_DATA_DIR: /data   # per-user game saves (NetHack + Crawl) persist here
    extra_hosts:
      - "host.docker.internal:${WINDOWS_HOST:-host-gateway}"
    # ITS OWN NETWORK, shared with the gateway and nothing else (the top-level `networks:` at the
    # end of this file). Every rail believes X-Platform-User when it is present, and this is the
    # one container that hands its users a real shell (NetHack's `!`, tmux/byobu panes). On the
    # default network that shell could name every rail and be anyone, admin included: measured
    # 2026-10-09 as gameuser, recipe-book's /api/capabilities answered 401 bare and 200 with
    # "X-Platform-User: admin". Here no other service resolves or routes. The broker
    # (host.docker.internal, above) and internet egress still work: the network is an ordinary
    # bridge, not `internal`. The other half is in the backend, which honours identity headers
    # only from the gateway's address (terminal_fun_app/main.py). Dropping either fails
    # tools/tests/test_terminal_fun_network.py or rails/terminal-fun/backend/tests.
    networks:
      - terminal_fun_net
    # Sandbox: no new privileges, all Linux caps dropped bar the two needed to DROP privilege,
    # writable temp on tmpfs. NOT read_only rootfs — some games (e.g. nethack) write into
    # /var/games at runtime.
    #
    # PID 1 is root ONLY so the entrypoint can setpriv down to gameuser for the PTY, keeping the
    # game out of uvicorn's uid. Without that split an escaped game shell reads
    # /proc/1/environ — and BROKER_AUTH_TOKEN there is not terminal-fun's own credential, it is
    # the single one every broker client shares. The entrypoint refuses to exec uvicorn as root,
    # so "user: 0:0" cannot silently become "the backend runs as root".
    #
    # SETUID/SETGID are required because a runtime uid change needs CAP_SETUID and cap_drop: ALL
    # removes it even from uid 0. There is no capability-free path: no-new-privileges kills
    # setuid binaries and Docker's seccomp profile blocks unshare(CLONE_NEWUSER).
    user: "0:0"
    # /tmp is sized because an unsized tmpfs is bounded only by the VM's memory. It holds every play
    # session's HOME (sandbox.make_session_home; a Crawl session's is seeded with the player's
    # whole saved ~/.crawl), hollywood's tmux socket folder, and whatever an escaped game shell
    # writes. 256m holds several players at the cap of four sessions each with room for a large
    # Crawl tree; a full /tmp fails a session (ENOSPC), not the VM. The lean compose's is the same.
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    volumes:
      # per-user save/resume state (NetHack + Crawl), persisted.
      # ⚠ Mode 0700 funuser, and the DOCKERFILE CANNOT SET THAT. A named volume keeps the
      # ownership and mode it was created with, so the image's chmod is inert for a volume that
      # already exists: one created before the uid split stays 0755, and an escaped game shell
      # can then READ every other player's saves even though the split blocks writing them.
      # Fix it once, out of band:
      #     docker run --rm -v platform_terminal_fun_data:/v alpine chmod 700 /v
      # (not from inside the rail: cap_drop: ALL removes CAP_FOWNER, so even root there cannot
      # chmod a file it does not own). Re-check with `ls -ld /data` after ever recreating it.
      - terminal_fun_data:/data
    expose:
      - "8730"
    restart: always

  ai-playground:                 # AI Playground — multi-demo rail (first demo: RAG over documents).
    # Retrieval via @embed (bge-m3) + local generation via @ai-playground (Nemotron) through the
    # broker; the in-demo NIM toggle flips generation to the NVIDIA cloud. Streams tokens over a
    # WebSocket (the gateway's live /ws proxy). Torch-free.
    build:
      context: ../rails/ai-playground   # uses ai-playground/deploy/Dockerfile
      dockerfile: deploy/Dockerfile
    image: ai-playground-backend:latest
    environment:
      AI_PLAYGROUND_DATA_DIR: /srv/var
      AI_PLAYGROUND_SEED_DIR: /srv/seed/corpora
      AI_PLAYGROUND_BROKER_URL: http://host.docker.internal:11500
      BROKER_AUTH_TOKEN: ${BROKER_AUTH_TOKEN:-}   # broker control-plane token (deploy/.env)
      # Local generation role (repointable via Admin > Rails) + the retrieval embedder.
      AI_PLAYGROUND_CHAT_MODEL: ${AI_PLAYGROUND_CHAT_MODEL:-@ai-playground}
      AI_PLAYGROUND_EMBED_MODEL: ${AI_PLAYGROUND_EMBED_MODEL:-@embed}
      # NVIDIA NIM toggle: key from the gitignored deploy/.env. Absent => toggle greyed out.
      AI_PLAYGROUND_NVIDIA_API_KEY: ${AI_PLAYGROUND_NVIDIA_API_KEY:-}
      AI_PLAYGROUND_NVIDIA_BASE_URL: ${AI_PLAYGROUND_NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      # NVIDIA has retired this default twice (nemotron-mini-4b-instruct 2026-08-26,
      # mistral-nemotron 2026-09-28): key valid, model 410 Gone. Plain-instruct replacement,
      # verified by a real completion; see nim.py for the history, why not a reasoning model,
      # and why /v1/models is not proof of entitlement.
      AI_PLAYGROUND_NVIDIA_CHAT_MODEL: ${AI_PLAYGROUND_NVIDIA_CHAT_MODEL:-meta/llama-3.2-11b-vision-instruct}
      # Host Ollama for the Embedding Lab's pull button and the weekly re-pull (bench/pull.py);
      # the rail's own default, passed through so a box whose Ollama is elsewhere can say so.
      AI_PLAYGROUND_OLLAMA_URL: ${AI_PLAYGROUND_OLLAMA_URL:-http://host.docker.internal:11434}
      # Blank = the weekly re-pull SKIPS the platform @embed model (a new digest would stale every
      # rail's stored vectors). 1 opts in; see deploy/.env.example.
      AI_PLAYGROUND_REPULL_EMBEDDER: ${AI_PLAYGROUND_REPULL_EMBEDDER:-}
      TZ: ${TZ:-America/Los_Angeles}
    extra_hosts:
      - "host.docker.internal:${WINDOWS_HOST:-host-gateway}"
    volumes:
      - ai_playground_data:/srv/var   # corpora DB + uploaded docs (seed corpora baked into the image)
    expose:
      - "8850"
    restart: always

  co-worker:                     # Co-Worker — email/calendar/Teams intelligence inbox.
    # An external harvest process (a Claude co-work scheduled task running on the Windows
    # host) drops JSON items into the inbox; this backend reads them and synthesises the
    # executive brief through the broker. See rails/co-worker/SCHEMA.md for the item
    # contract and rails/co-worker/rail.json for the rail's declared shape.
    #
    # ONE chat slot (@co-worker-synthesis) and no embedder: the brief is built from whole
    # items, not retrieved chunks.
    build:
      context: ../rails/co-worker   # uses co-worker/deploy/Dockerfile
      dockerfile: deploy/Dockerfile
    image: co-worker-backend:latest
    environment:
      CO_WORKER_INBOX_DIR: /data/inbox
      CO_WORKER_PROMPTS_DIR: /data/prompts
      CO_WORKER_BROKER_URL: http://host.docker.internal:11500
      BROKER_AUTH_TOKEN: ${BROKER_AUTH_TOKEN:-}   # broker control-plane token (deploy/.env)
      # @role so Admin -> Rails can repoint the synthesis model like any other rail's.
      CO_WORKER_SYNTHESIS_MODEL: ${CO_WORKER_SYNTHESIS_MODEL:-@co-worker-synthesis}
      # The inbox owner, so synthesis relabels their own items "(self)" and never writes
      # "Reply to <yourself>". Unpassed, the filter could never fire in a container.
      CO_WORKER_USER_NAME: ${CO_WORKER_USER_NAME:-}
      CO_WORKER_USER_EMAIL: ${CO_WORKER_USER_EMAIL:-}
      # The platform username the inbox belongs to. Only that user's own refreshes may carry a
      # requester to the broker (and so reach the Claude CLI); blank keeps every pass local.
      CO_WORKER_INBOX_OWNER: ${CO_WORKER_INBOX_OWNER:-}
      CO_WORKER_AUTO_SYNTHESIZE: ${CO_WORKER_AUTO_SYNTHESIZE:-true}
      CO_WORKER_AUTO_SYNTHESIZE_MIN_INTERVAL_S: ${CO_WORKER_AUTO_SYNTHESIZE_MIN_INTERVAL_S:-900}
      TZ: ${TZ:-America/Los_Angeles}
    extra_hosts:
      - "host.docker.internal:${WINDOWS_HOST:-host-gateway}"
    volumes:
      # Bind-mount the Windows-side inbox so the harvest process (running on the host)
      # can write files this container reads. CO_WORKER_INBOX_MOUNT is the WSL-style
      # path to it (see deploy/.env). Falls back to a named volume if unset, which
      # yields an empty dashboard rather than a startup failure.
      - ${CO_WORKER_INBOX_MOUNT:-co_worker_inbox}:/data/inbox
      # Bind-mount the scheduler's job directory so the prompts panel shows the real
      # prompts. Mounted read-only — the backend never writes here.
      # Falls back to an empty named volume, which hides the prompts panel.
      - ${CO_WORKER_PROMPTS_MOUNT:-co_worker_prompts}:/data/prompts:ro
    expose:
      - "8890"
    restart: always

  watch-builder:                 # Watch Builder -- design, compile and render Pebble watchfaces.
    # The only rail whose image carries a cross-compiler: the Pebble SDK (ARM toolchain,
    # seven platform SDKs, seven QEMU emulators) is baked in, ~2 GB. The alternative was
    # mounting the host Docker socket to drive a sibling SDK image, which was rejected
    # because a rail that can drive the host's Docker is a privilege-escalation path and is
    # no longer an independent deployable (the rule docs/RAIL_CONTRACT.md opens with).
    #
    # ONE chat slot (@watch-builder-designer) and no embedder or vision slot: both AI
    # features are the same operation -- emit a schema-validated design document, which the
    # rail then compiles deterministically. The model never writes C.
    build:
      context: ../rails/watch-builder    # uses watch-builder/deploy/Dockerfile
      dockerfile: deploy/Dockerfile
    image: watch-builder-backend:latest
    environment:
      WATCH_BUILDER_DATA_DIR: /data/designs
      WATCH_BUILDER_WORK_DIR: /tmp/watch-builder
      WATCH_BUILDER_BROKER_URL: http://host.docker.internal:11500
      BROKER_AUTH_TOKEN: ${BROKER_AUTH_TOKEN:-}   # broker control-plane token (deploy/.env)
      # @role so Admin -> Rails can repoint the design model like any other rail's.
      WATCH_BUILDER_DESIGNER_MODEL: ${WATCH_BUILDER_DESIGNER_MODEL:-@watch-builder-designer}
      TZ: ${TZ:-America/Los_Angeles}
    extra_hosts:
      - "host.docker.internal:${WINDOWS_HOST:-host-gateway}"
    volumes:
      - watch_builder_data:/data/designs
    # A build tree is disposable and a seven-platform compile writes ~7 MB of object files,
    # so the scratch space is tmpfs rather than a volume: nothing here is worth persisting
    # and writing it to a volume would grow the volume forever.
    tmpfs:
      - /tmp/watch-builder:size=512m
    expose:
      - "8920"
    restart: always

  smb-partner-enablement:        # SMB Partner Enablement — grounded RAG + voice surface.
    # Keeps its generative model and @embed resident together once a question has loaded them,
    # so a follow-up costs no model swap. rails/smb-partner-enablement/MODELS.md sizes this for
    # an 8 GB card (llama3.2:3b); on a 24 GB card @smb-partner-rag resolves to a full-size
    # model instead, which is why WARM_ON_BOOT below defaults to off.
    build:
      context: ../rails/smb-partner-enablement
      dockerfile: deploy/Dockerfile
    image: smb-partner-backend:latest
    environment:
      SMB_PARTNER_BROKER_URL: http://host.docker.internal:11500
      # Client ceiling must sit ABOVE the broker's own media_timeout (1200s), or the
      # client gives up first: the worker keeps running, the retry queues behind the
      # job still holding the GPU, and the broker's own 502 never reaches the caller.
      SMB_PARTNER_BROKER_TIMEOUT: ${SMB_PARTNER_BROKER_TIMEOUT:-1320}
      BROKER_AUTH_TOKEN: ${BROKER_AUTH_TOKEN:-}
      SMB_PARTNER_RAG_MODEL: ${SMB_PARTNER_RAG_MODEL:-@smb-partner-rag}
      SMB_PARTNER_EMBED_MODEL: ${SMB_PARTNER_EMBED_MODEL:-@embed}
      # OFF unless deploy/.env sets it to 1. Listed here so that setting it in .env reaches the
      # container at all: a variable the rail reads but compose never passes is a silent no-op.
      # Nothing at boot needs a model resident (the seed ingest fingerprints first and loads the
      # embedder itself only for a collection that changed), and on 24 GB this role resolves to
      # a 24B model, so warming parked ~19.6 GB on the card for 30 minutes after every container
      # start, whether or not anyone opened the rail.
      SMB_PARTNER_WARM_ON_BOOT: ${SMB_PARTNER_WARM_ON_BOOT:-}
      # 'auto' probes the broker's media worker and falls back to browser speech synthesis.
      SMB_PARTNER_VOICE_BACKEND: ${SMB_PARTNER_VOICE_BACKEND:-auto}
      TZ: ${TZ:-America/Los_Angeles}
    extra_hosts:
      - "host.docker.internal:${WINDOWS_HOST:-host-gateway}"
    volumes:
      - smb_partner_data:/srv/var
    expose:
      - "8870"
    restart: always

  gemini-cx:                     # Gemini Enterprise CX — grounded RAG over a GECX subject-matter
    # corpus, fronted by a curated question deck. Holds @gemini-cx-rag resident alongside
    # @embed through the broker's VRAM policy once a question has loaded them, so a follow-up
    # costs no model swap. No voice model competing for the card — see
    # rails/gemini-cx/MODELS.md. Torch-free.
    build:
      context: ../rails/gemini-cx      # uses gemini-cx/deploy/Dockerfile
      dockerfile: deploy/Dockerfile
    image: gemini-cx-backend:latest
    environment:
      GEMINI_CX_BROKER_URL: http://host.docker.internal:11500
      # Client ceiling must sit ABOVE the broker's own media_timeout (1200s), or the
      # client gives up first: the worker keeps running, the retry queues behind the
      # job still holding the GPU, and the broker's own 502 never reaches the caller.
      GEMINI_CX_BROKER_TIMEOUT: ${GEMINI_CX_BROKER_TIMEOUT:-1320}
      BROKER_AUTH_TOKEN: ${BROKER_AUTH_TOKEN:-}   # broker control-plane token (deploy/.env)
      GEMINI_CX_RAG_MODEL: ${GEMINI_CX_RAG_MODEL:-@gemini-cx-rag}
      GEMINI_CX_EMBED_MODEL: ${GEMINI_CX_EMBED_MODEL:-@embed}
      # OFF by default, deliberately — same reasoning as the smb-partner-enablement twin above:
      # on 24 GB this role resolves to a 24B model, and nothing at boot needs it resident.
      GEMINI_CX_WARM_ON_BOOT: ${GEMINI_CX_WARM_ON_BOOT:-}
      # Read aloud: Kokoro-82M via the broker's tts_light — NOT /v1/tts, which evicts every
      # heavy model per utterance. 'auto' probes media and falls back to browser speech.
      GEMINI_CX_VOICE_BACKEND: ${GEMINI_CX_VOICE_BACKEND:-auto}
      GEMINI_CX_VOICE_SPEAKER: ${GEMINI_CX_VOICE_SPEAKER:-af_heart}
      TZ: ${TZ:-America/Los_Angeles}
    extra_hosts:
      - "host.docker.internal:${WINDOWS_HOST:-host-gateway}"
    volumes:
      - gemini_cx_data:/srv/var   # chunk index + uploaded docs (seed corpus baked into the image)
    expose:
      - "8880"
    restart: always

  meeting-atlas:                 # Meeting Atlas — indexes Meetily recordings and rolls
    # them up by day, week and month. Does NO inference and never calls the broker, so it
    # gets no BROKER_AUTH_TOKEN and declares no model slots (see rails/meeting-atlas/rail.json).
    #
    # Same writer/reader split as co-worker: an external task running a frontier model on the
    # host writes transcript.enriched.json / summary.json sidecars into each meeting folder,
    # and this backend reads them. Contract: rails/meeting-atlas/INGEST.md.
    build:
      context: ../rails/meeting-atlas   # uses meeting-atlas/deploy/Dockerfile
      dockerfile: deploy/Dockerfile
    image: meeting-atlas-backend:latest
    environment:
      MEETING_ATLAS_RECORDINGS_DIR: /data/recordings
      # Derived from the mount below, not set independently. These were two operator
      # variables for one path, so setting either alone gave you a mounted-but-unread
      # database or a configured-but-missing one, and the only symptom was titles quietly
      # falling back to the folder name. `:+` substitutes only when the mount is set.
      MEETING_ATLAS_MEETILY_DB: ${MEETING_ATLAS_MEETILY_DB_MOUNT:+/data/meetily.db}
      # Recording timestamps are UTC; everything a user reads is local. A wrong value here
      # shifts every meeting by hours while looking entirely plausible.
      MEETING_ATLAS_DISPLAY_TZ: ${TZ:-America/Los_Angeles}
      MEETING_ATLAS_AUTOREINDEX_SECONDS: ${MEETING_ATLAS_AUTOREINDEX_SECONDS:-300}
      # Documented in backend/.env.example and the README but previously not passed, so the
      # knob silently did nothing from compose.
      MEETING_ATLAS_SERVE_AUDIO: ${MEETING_ATLAS_SERVE_AUDIO:-true}
      TZ: ${TZ:-America/Los_Angeles}
    # No extra_hosts: this rail has no HTTP client compiled in (see backend/pyproject.toml --
    # no httpx, no requests) and never contacts the host. Carrying host.docker.internal here
    # was copy-paste from the broker-backed rails and reads as "this one talks to the host".
    volumes:
      # The Meetily recordings tree, READ-ONLY — not just hygiene: under Podman/Hyper-V this
      # is a 9p mount, and 9p rejects rename-over-an-existing-file, the trap that silently
      # broke every co-worker triage write. The backend keeps its index in memory, so it has
      # no write path here at all. Unset falls back to an empty named volume, which yields an
      # empty rail rather than a startup failure.
      - ${MEETING_ATLAS_RECORDINGS_MOUNT:-meeting_atlas_recordings}:/data/recordings:ro
      # OPTIONAL: the Meetily SQLite, read-only — the only place Meetily keeps the real
      # meeting title and its own summary. ONE variable now: point it at the database FILE
      # on the host and the env above follows. Unset falls back to an empty named volume,
      # and titles come from summary.json sidecars instead.
      - ${MEETING_ATLAS_MEETILY_DB_MOUNT:-meeting_atlas_db}:/data/meetily.db:ro
    expose:
      - "8740"
    restart: always

  openmaic:                      # OpenMAIC — a topic or an uploaded document becomes an
    # interactive class: generated slides, quizzes and simulations delivered by an AI teacher.
    # THIN WRAPPER, not the application. The courseware engine is the openmaic-app container
    # below; this rail reverse-proxies it under /openmaic/api/app/ so the gateway's
    # X-Platform-User gate stays in front of it, and hosts the OpenAI-compatible translation
    # shim at /api/llm/v1 that openmaic-app generates through. Pointing the app straight at
    # Ollama would work but would bypass the broker's GPU gate, letting course generation evict
    # every other rail's model off an 8 GB card. See rails/openmaic/rail.json.
    build:
      context: ../rails/openmaic       # uses openmaic/deploy/Dockerfile
      dockerfile: deploy/Dockerfile
    image: openmaic-backend:latest
    environment:
      OPENMAIC_BROKER_URL: http://host.docker.internal:11500
      # A call the shim names a requester on may wait out the Claude CLI and then a local answer.
      OPENMAIC_BROKER_TIMEOUT: ${OPENMAIC_BROKER_TIMEOUT:-1320}
      # The proxy's wait on the app, which waits on that same call when it generates.
      OPENMAIC_APP_TIMEOUT: ${OPENMAIC_APP_TIMEOUT:-1320}
      BROKER_AUTH_TOKEN: ${BROKER_AUTH_TOKEN:-}   # broker control-plane token (deploy/.env)
      OPENMAIC_LLM_MODEL: ${OPENMAIC_LLM_MODEL:-@openmaic}
      OPENMAIC_EMBED_MODEL: ${OPENMAIC_EMBED_MODEL:-@embed}
      OPENMAIC_APP_URL: http://openmaic-app:3000
      # Shared secret the shim requires on /api/llm/v1; openmaic-app presents it as OLLAMA_API_KEY.
      OPENMAIC_SHIM_TOKEN: ${OPENMAIC_SHIM_TOKEN:-openmaic-local-dev}
      # Overrides the shim with an external OpenAI-compatible endpoint (e.g. a larger-VRAM host
      # on the LAN). Set, the reasoning chip reports the override rather than broker residency.
      OPENMAIC_LLM_BASE_URL: ${OPENMAIC_LLM_BASE_URL:-}
      # SINGLE-USER BOXES ONLY: the account the shim names on the app's generation calls while
      # it is the app's only user, so they may reach that owner's Claude CLI. Blank names nobody.
      OPENMAIC_CLI_REQUESTER: ${OPENMAIC_CLI_REQUESTER:-}
      TZ: ${TZ:-America/Los_Angeles}
    extra_hosts:
      - "host.docker.internal:${WINDOWS_HOST:-host-gateway}"
    # `default`, where the gateway reaches this rail, AND openmaic-app's own network, now the only
    # way to reach http://openmaic-app:3000 (see the note on openmaic-app). `default` must be
    # named: a service that lists networks gets only the ones it lists.
    networks:
      - default
      - openmaic_app_net
    expose:
      - "8900"
    restart: always

  openmaic-app:                  # the upstream OpenMAIC Next.js app (THU-MAIC/OpenMAIC).
    # Its source is NOT in this repo, so this is a PRE-BUILT image with no `build:` stanza — a
    # build context pointing outside the repo breaks the installer. Build or pull the image
    # separately and name the tag in OPENMAIC_APP_IMAGE.
    image: ${OPENMAIC_APP_IMAGE:-openmaic-app:latest}
    labels:
      # Exists only for the openmaic rail: disabling `openmaic` on a box (PLATFORM_DISABLED_APPS)
      # parks this container too (deploy/installer/sync-disabled-rails.ps1 reads this label).
      ai-platform.rail: openmaic
    environment:
      # The rail's shim, NOT Ollama — every token this app generates goes through the broker.
      # The rail's shim by default. OPENMAIC_LLM_BASE_URL redirects generation to an
      # external OpenAI-compatible endpoint instead (a larger-VRAM host on the LAN, a
      # hosted provider). It has to be substituted HERE: the rail reads the same variable
      # only to label its chip, so setting it without this line changed what the header
      # claimed and nothing about where a single token was generated.
      OLLAMA_BASE_URL: ${OPENMAIC_LLM_BASE_URL:-http://openmaic:8900/api/llm/v1}
      # Falls through to the shim token, because the shim is the default endpoint. An
      # external endpoint needs its own credential: set OPENMAIC_LLM_API_KEY with it.
      OLLAMA_API_KEY: ${OPENMAIC_LLM_API_KEY:-${OPENMAIC_SHIM_TOKEN:-openmaic-local-dev}}
      OLLAMA_MODELS: "@openmaic"
      # MANDATORY: OpenMAIC has no hardcoded model fallback, so generation fails outright when
      # this is unset rather than degrading to a default. The `ollama:` provider prefix is just
      # as required — without it the model string is parsed as OpenAI and never reaches the shim.
      DEFAULT_MODEL: ${OPENMAIC_DEFAULT_MODEL:-ollama:@openmaic}
      TZ: ${TZ:-America/Los_Angeles}
    # ITS OWN NETWORK, shared with the openmaic rail and nothing else (the top-level `networks:`
    # at the end of this file). This is third-party code, and every rail but terminal-fun and
    # openmaic believes X-Platform-User from anything on `default`: there, an upstream release
    # that turned hostile, or a server-side fetch in it that can be steered, could name any user,
    # admin included, to every rail. Here the one service that resolves is `openmaic`, which
    # proxies this app (OPENMAIC_APP_URL) and hosts the shim it generates through
    # (OLLAMA_BASE_URL above). An ordinary bridge, not `internal`, so an OPENMAIC_LLM_BASE_URL
    # endpoint and anything else outside the stack stay reachable. Dropping this fails
    # tools/tests/test_openmaic_app_network.py.
    networks:
      - openmaic_app_net
    volumes:
      - openmaic_app_data:/app/data   # generated courses + uploads, persisted across rebuilds
    expose:
      - "3000"
    restart: always

  gateway:                       # shell host + reverse proxy
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    image: platform-gateway:latest
    depends_on:
      - recipe-book
      - workstation
      - terminal-fun
      - ai-playground
      - co-worker
      - smb-partner-enablement
      - gemini-cx
      - meeting-atlas
      - openmaic
      - watch-builder
    environment:
      PLATFORM_BROKER_URL: http://host.docker.internal:11500
      # Client ceiling must sit ABOVE the broker's own media_timeout (1200s), or the
      # client gives up first: the worker keeps running, the retry queues behind the
      # job still holding the GPU, and the broker's own 502 never reaches the caller.
      PLATFORM_BROKER_TIMEOUT: ${PLATFORM_BROKER_TIMEOUT:-1320}
      BROKER_AUTH_TOKEN: ${BROKER_AUTH_TOKEN:-}   # broker control-plane token (deploy/.env)
      # Direct Ollama endpoint — only the admin model-pool Delete (ollama rm) uses it.
      PLATFORM_OLLAMA_URL: http://host.docker.internal:11434
      PLATFORM_APP_RECIPE_BOOK_URL: http://recipe-book:8830
      PLATFORM_APP_WORKSTATION_URL: http://workstation:8720
      PLATFORM_APP_TERMINAL_FUN_URL: http://terminal-fun:8730
      PLATFORM_APP_AI_PLAYGROUND_URL: http://ai-playground:8850
      PLATFORM_APP_CO_WORKER_URL: http://co-worker:8890
      PLATFORM_APP_SMB_PARTNER_ENABLEMENT_URL: http://smb-partner-enablement:8870
      PLATFORM_APP_WATCH_BUILDER_URL: http://watch-builder:8920
      PLATFORM_APP_GEMINI_CX_URL: http://gemini-cx:8880
      PLATFORM_APP_OPENMAIC_URL: http://openmaic:8900
      PLATFORM_APP_MEETING_ATLAS_URL: http://meeting-atlas:8740
      PLATFORM_FRONTEND_DIST: /app/shell-dist
      PLATFORM_RECIPE_BOOK_DIST: /app/recipe-book-dist
      PLATFORM_WORKSTATION_DIST: /app/workstation-dist
      PLATFORM_TERMINAL_FUN_DIST: /app/terminal-fun-dist
      PLATFORM_AI_PLAYGROUND_DIST: /app/ai-playground-dist
      PLATFORM_CO_WORKER_DIST: /app/co-worker-dist
      PLATFORM_SMB_PARTNER_ENABLEMENT_DIST: /app/smb-partner-dist
      PLATFORM_GEMINI_CX_DIST: /app/gemini-cx-dist
      PLATFORM_OPENMAIC_DIST: /app/openmaic-dist
      PLATFORM_MEETING_ATLAS_DIST: /app/meeting-atlas-dist
      PLATFORM_WATCH_BUILDER_DIST: /app/watch-builder-dist
      # auth / multi-tenant
      PLATFORM_DB_URL: sqlite:////data/platform.db
      PLATFORM_ADMIN_USER: ${PLATFORM_ADMIN_USER:-admin}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      # MUST be true once served over HTTPS/public (see Caddyfile + INSTRUCTIONS).
      PLATFORM_COOKIE_SECURE: ${PLATFORM_COOKIE_SECURE:-false}
      # Which rails this deployment serves (comma list or JSON array). Passed through with NO
      # default on purpose: unset in deploy/.env means unset in the container, i.e. the gateway's
      # own default, every rail. A `${...:-}` blank would reach a gateway image built before the
      # blank-means-unset rule as "" and parse to NO rails. Until this line existed, a value set
      # in deploy/.env was silently ignored on the full stack.
      PLATFORM_ENABLED_APPS:
      # Rails THIS box deliberately does not run (comma list), subtracted from the list above.
      # Blank means nothing is disabled (an older gateway image ignores the variable outright),
      # so a blank default is safe here. The maintainers' smoke sweep (not in the public snapshot)
      # reads both lines from deploy/.env and prints each rail they leave out as SKIP.
      PLATFORM_DISABLED_APPS: ${PLATFORM_DISABLED_APPS:-}
      # Session lifetime in hours: the cookie's max-age and the server-side expiry. Read by the
      # gateway (GatewaySettings.session_ttl_hours) but never passed in until now, so a value
      # set in deploy/.env changed nothing.
      PLATFORM_SESSION_TTL_HOURS: ${PLATFORM_SESSION_TTL_HOURS:-168}
      # The model-pool scan describes newly seen models with this role or model, at most CAP
      # per sweep (platform_maintenance.py). Same story: read, never passed through.
      PLATFORM_DESCRIBE_MODEL: ${PLATFORM_DESCRIBE_MODEL:-@chat-fast}
      PLATFORM_DESCRIBE_CAP: ${PLATFORM_DESCRIBE_CAP:-8}
      # The request-body ceiling for a rail that declares none (GatewaySettings.max_request_bytes).
      # Blank means the gateway's own default, so the figure is stated in one place.
      PLATFORM_MAX_REQUEST_BYTES: ${PLATFORM_MAX_REQUEST_BYTES:-}
      # The WebSocket proxy's Origin allowlist (comma list or JSON array); unset is same-origin.
      # `[]`, not a blank, by default: a gateway image built before the comma form JSON-decodes
      # this value and stops at import on a blank, while `[]` is same-origin to old and new alike.
      PLATFORM_ALLOWED_WS_ORIGINS: "${PLATFORM_ALLOWED_WS_ORIGINS:-[]}"
    extra_hosts:
      - "host.docker.internal:${WINDOWS_HOST:-host-gateway}"
    # The default network (caddy and every other rail) AND terminal-fun's own, which is now the
    # only way to reach http://terminal-fun:8730. Naming `default` is required: a service that
    # lists networks gets only the ones it lists. See the note on the terminal-fun service.
    networks:
      - default
      - terminal_fun_net
    volumes:                     # host-built dists, mounted read-only
      - ../apps/platform/frontend/dist:/app/shell-dist:ro
      - ../rails/recipe-book/frontend/dist:/app/recipe-book-dist:ro
      - ../rails/workstation/frontend/dist:/app/workstation-dist:ro
      - ../rails/terminal-fun/frontend/dist:/app/terminal-fun-dist:ro
      - ../rails/ai-playground/frontend/dist:/app/ai-playground-dist:ro
      - ../rails/co-worker/frontend/dist:/app/co-worker-dist:ro
      # Contains dist/m/ too — the standalone mobile build, served at /smb-partner-enablement/m/.
      - ../rails/smb-partner-enablement/frontend/dist:/app/smb-partner-dist:ro
      - ../rails/gemini-cx/frontend/dist:/app/gemini-cx-dist:ro
      - ../rails/openmaic/frontend/dist:/app/openmaic-dist:ro
      - ../rails/meeting-atlas/frontend/dist:/app/meeting-atlas-dist:ro
      - ../rails/watch-builder/frontend/dist:/app/watch-builder-dist:ro
      - gateway_data:/data       # auth DB (users/sessions/entitlements), persisted
    expose:
      - "8700"
    restart: always

  caddy:                         # TLS + reverse proxy front door
    # Fully qualified deliberately. Docker resolves a bare `caddy:2` against Docker Hub
    # implicitly; Podman has no implicit default registry, and a machine with no
    # /etc/containers/registries.conf has no unqualified-search-registries to fall back on
    # either, so the short name simply fails to resolve. Qualifying costs Docker nothing and
    # is the difference between a Podman install starting and not starting.
    image: docker.io/library/caddy:2
    depends_on:
      - gateway
    ports:
      # Published on a high host port instead of privileged 80/443. Recreating this
      # container on a full `compose up` was rebinding 80/443 and churning the Windows
      # Docker/WSL NAT, which briefly dropped host internet. Where a tunnel fronts the box,
      # it terminates public TLS and forwards plain HTTP to this port, so no local 443 is
      # needed (deploy/INSTRUCTIONS.md has the Caddy-certificate path for a LAN-only box).
      # REQUIRED when changing this: update that tunnel's service URL to the new port, and
      # use http://platform.localhost:1111 locally.
      - "1111:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: always

volumes:
  meeting_atlas_recordings:   # empty by default; point MEETING_ATLAS_RECORDINGS_MOUNT at the real tree
  meeting_atlas_db:           # empty by default; the optional read-only Meetily SQLite
  caddy_data:
  caddy_config:
  workstation_audit:  # workstation session audit log (rotated daily, retention-capped)
  gateway_data:   # persists the gateway auth DB across rebuilds
  recipe_book_data: # persists recipe-book's DB + markdown corpus + generated icons across rebuilds
  ai_playground_data: # persists ai-playground's corpora DB + uploaded docs (seed corpora baked into the image)
  terminal_fun_data:  # terminal-fun per-user save/resume state (NetHack + Crawl)
  co_worker_inbox:    # fallback drop-zone when CO_WORKER_INBOX_MOUNT is unset (empty dashboard)
  co_worker_prompts:  # fallback when CO_WORKER_PROMPTS_MOUNT is unset (hides the prompts panel)
  smb_partner_data:   # SMB Partner chunk index + uploaded SME docs (seed KB baked into the image)
  gemini_cx_data:     # Gemini CX chunk index + uploaded docs (seed GECX corpus baked into the image)
  openmaic_app_data:  # the upstream OpenMAIC app's own /app/data - generated courses + uploads
  watch_builder_data: # saved watchface design documents, one JSON file per design, owner-scoped

networks:
  # terminal-fun's own: the gateway and terminal-fun, nobody else. An ordinary bridge, NOT
  # `internal: true`, which would cut host.docker.internal (the broker) along with the internet.
  # Every other service is on the implicit `default` network, openmaic and openmaic-app aside
  # (below). The key is not a service name on purpose: RC033 reads the gateway's `- terminal-fun`
  # list line as its depends_on entry, and a network called that would satisfy it with the
  # dependency gone.
  terminal_fun_net:
  # openmaic-app's own: openmaic-app and the openmaic rail, nobody else; the rail stays on
  # `default` too, for the gateway. An ordinary bridge, for the app's own outbound calls. Not
  # keyed by a service name either: a `- openmaic-app` list line reads as a dependency.
  openmaic_app_net:
