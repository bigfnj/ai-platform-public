[project]
name = "dashboard"
version = "0.1.0"
description = "Local web dashboard for special-ed instructors: pick a workflow, upload docs, download bundled outputs"
requires-python = ">=3.11,<3.12"
dependencies = [
    "edu-media-core",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
edu-dashboard = "dashboard.serve:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashboard"]

[tool.uv.sources]
edu-media-core = { workspace = true }
