<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeachTown Adventures</title><script defer src="vendor/pdf.min.js"></script><script defer src="worksheet-renderer.js"></script><script defer src="activities.js"></script><link rel="stylesheet" href="annotation.css"><link rel="stylesheet" href="vocabulary.css"><link rel="stylesheet" href="worksheet-size.css"><link rel="stylesheet" href="activities.css">
<style>*{box-sizing:border-box}body{margin:0;background:#fffaf0;color:#24304a;font-family:"Trebuchet MS",Arial,sans-serif}.hero{padding:28px 6vw 64px;color:#fff;background:linear-gradient(135deg,#ff7979,#ff9a62);position:relative}.beats .hero{background:linear-gradient(135deg,#4e63d9,#6d88f1)}.brand{font-weight:900}.brand small{display:block;opacity:.8}.hero h1{font-size:clamp(40px,7vw,70px);line-height:1;margin:55px 0 10px;max-width:800px}.hero p{font-size:20px;max-width:680px;line-height:1.5}.switch,.weeks{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:18px}.switch{margin-top:-34px;position:relative}.switch button,.weeks button{border:0;border-radius:18px;padding:15px 22px;background:#fff;box-shadow:0 8px 25px #24304a22;font-weight:900;cursor:pointer}.switch button.on{outline:4px solid #ffd166}.weeks button{background:#e9e6dc;box-shadow:none}.weeks button.on{background:#24304a;color:#fff}.layout{max-width:1180px;margin:10px auto 60px;padding:0 22px;display:grid;grid-template-columns:210px 1fr;gap:28px}.subjects{background:#fff;padding:18px;border-radius:24px;height:max-content;box-shadow:0 12px 35px #24304a12}.subjects button{width:100%;border:0;background:transparent;border-radius:13px;padding:12px;text-align:left;font-weight:800;cursor:pointer}.subjects button.on{background:#fff0e9}.beats .subjects button.on{background:#eef1ff}.topline{display:flex;justify-content:space-between;align-items:end}.topline h2{font-size:34px;margin:5px 0 20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(260px,1fr));gap:18px}.mission{border:0;border-radius:23px;padding:24px;background:#fff;text-align:left;box-shadow:0 10px 25px #24304a12;cursor:pointer;border-left:7px solid var(--c);transition:.2s}.mission:hover{transform:translateY(-4px)}.mission small{font-weight:900;color:var(--c)}.mission h3{font-size:22px;margin:8px 0}.mission p{color:#68738a;line-height:1.4}.mission b{color:var(--c)}.overlay{position:fixed;inset:0;background:#19213ccc;display:grid;place-items:center;padding:18px;z-index:10}.dialog{background:#fffdf7;border-radius:30px;width:min(820px,100%);max-height:94vh;overflow:auto;padding:34px;position:relative}.close{position:absolute;right:18px;top:15px;border:0;border-radius:50%;font-size:24px;width:38px;height:38px;cursor:pointer}.dialog h2{font-size:34px;margin-bottom:8px}.prompt{font-size:21px;line-height:1.45}.worksheet{border:2px solid #dbe2ef;border-radius:18px;overflow:hidden;margin:18px 0;background:#f8faff}.worksheet summary{cursor:pointer;padding:13px 16px;font-weight:900}.worksheet object{width:100%;height:430px;background:#fff;display:block}.choices{display:grid;gap:10px;margin:20px 0}.choices button,.cards button{padding:14px;border:2px solid #d7deeb;border-radius:14px;background:#fff;font-size:16px;font-weight:900;cursor:pointer}.choices button.pick{border-color:#ff765f;background:#fff0e9}.answer{width:100%;padding:16px;border:3px solid #ccd5e6;border-radius:15px;font-size:18px}.cards{display:flex;gap:10px;flex-wrap:wrap}.cards button{background:#fff0bf}.drop{border:3px dashed #9ba9c2;border-radius:18px;min-height:80px;padding:20px;margin:15px 0;color:#69758c}.footer{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:20px;border-top:1px solid #e4e8ef;padding-top:18px}.footer button{background:#24304a;color:#fff;border:0;border-radius:15px;padding:14px 20px;font-weight:900;cursor:pointer}.footer button:disabled{opacity:.35}.hidden{display:none}@media(max-width:760px){.layout{grid-template-columns:1fr}.subjects{display:flex;flex-wrap:wrap}.subjects button{width:auto}.grid{grid-template-columns:1fr}.worksheet object{height:330px}}</style><style>.audioBtn{border:0;background:#ffd16655;border-radius:50%;width:26px;height:26px;cursor:pointer;margin:0 6px;font-size:13px;vertical-align:middle}.audioBtn:hover{background:#ffd166}.vocabCard b.es{color:#4e63d9}.vocabCard .es{opacity:.92}main:not(.enriched) .es-only{display:none}</style></head>
<body><div id="app"></div><script>
let meta={ELA:['📚','#ff6b6b'],Math:['🔢','#5b8def'],Science:['🔬','#40b983'],'Social Studies':['🌎','#a56de2']};
let weekInfo={};
let data={};
let vocabIcons={Malala:'👧🏽',education:'🏫',rights:'⚖️',leader:'🧭',triangle:'🔺',area:'📐',heat:'☀️',pharaoh:'👑',event:'🎬',evidence:'🔎',setting:'🏞️',plot:'🧩',rectangle:'▭',length:'📏',absorb:'🧽',nationalism:'🏳️',injured:'🩹',hospital:'🏥',coordinate:'📍',vertex:'🔸',polygon:'⬡',candidate:'🙋',ballot:'🗳️',election:'✅',theme:'💡','point of view':'👀',revise:'✏️','side length':'📏','coordinate plane':'🔲',space:'↔️',instrument:'🎸',musician:'🎵',influence:'✨',orally:'🗣️','right triangle':'📐',hypotenuse:'📏','balanced diet':'🥗',suffix:'🔤',denotation:'📖',paraphrase:'💬',inference:'🧠',congruent:'🟰',protein:'🥚',unification:'🤝',confederation:'🔗',etymology:'🌱',derivation:'➡️',summary:'📝',parallelogram:'▱',degree:'🌡️',imperialism:'🗺️',industrialization:'🏭',colony:'🏝️',hyperbole:'😲',metaphor:'🌉',simile:'🪞',idiom:'💭',connotation:'❤️',trapezoid:'⏢',base:'⬇️',leg:'🦵'};
let units={},brand={title:'✦ TeachTown Adventures',tagline:'Learn • Play • Grow'};
let state={unit:'',week:1,subject:'All',active:null,answer:'',done:new Set(),tool:'text',notes:{}};const app=document.querySelector('#app');
let ENR={vocab:{},learn:{},missions:{}};let ttAudio=null;
function enrHas(){return Object.keys(ENR.vocab).length||Object.keys(ENR.learn).length||Object.keys(ENR.missions).length;}
function enrVocab(w){return ENR.vocab[state.unit+'|'+w]||null;}
function enrLearn(w){return ENR.learn[state.unit+'|'+w]||null;}
function enrMission(t){return ENR.missions[state.unit+'|'+t]||null;}
function ttPlay(src){if(!src)return;if(ttAudio)ttAudio.pause();ttAudio=new Audio(src);ttAudio.play().catch(()=>{});}
function audioBtn(src,label,cls){return src?`<button class="audioBtn ${cls||''}" data-audio="${src}" title="${label}">🔊</button>`:'';}
function vocabCard(v){const en=v[0],def=v[1],e=enrVocab(en);let s='<div class="vocabCard"><div class="vocabBody">';s+=`<div class="vocabRow en-only"><b>${en}</b>${e?audioBtn(e.audio_en,'Play English'):''}</div>`;s+=`<span class="vocabDef en-only">${def}</span>`;if(e){s+=`<div class="vocabRow es es-only"><b>${e.word_es||''}</b>${audioBtn(e.audio_es,'Play Spanish')}</div>`;if(e.def_es){s+=`<span class="vocabDef es es-only">${e.def_es}</span>`;}}s+='</div></div>';return s;}
function decorateVocab(){document.querySelectorAll('.vocabCard:not(.pictured)').forEach(card=>{let word=card.querySelector('b')?.textContent||'',pic=document.createElement('span');pic.className='vocabPic';pic.setAttribute('aria-hidden','true');pic.textContent=vocabIcons[word]||'🖼️';card.prepend(pic);card.classList.add('pictured')})}
function answerSpots(title){if(title.includes('Warm-Up'))return [[22,26],[70,26],[22,58],[70,58],[48,86]];if(title.includes('Area')||title.includes('Triangle Treasure')||title.includes('Shape Shop'))return [[60,27],[60,43],[60,59],[60,75],[60,91]];if(title.includes('Reading')||title.includes('Story Quest')||title.includes('Checkpoint')||title.includes('Brave Moments')||title.includes('Message'))return [[78,22],[78,38],[78,54],[78,70],[78,86]];if(title.includes('Matching')||title.includes('Character')||title.includes('Sort')||title.includes('Worksheet')||title.includes('Builder'))return [[75,23],[75,39],[75,55],[75,71],[75,87]];return [[77,25],[77,42],[77,59],[77,76]]}
function decorateAnswerBoxes(){let canvas=document.querySelector('.worksheetCanvas');if(!canvas||canvas.dataset.answers==='ready'||state.active===null)return;let a=data[state.unit][state.active],stage=document.createElement('div'),dock=document.createElement('aside');stage.className='worksheetStage';dock.className='answerDock';canvas.before(stage);stage.append(canvas,dock);let act=(units[state.unit]&&units[state.unit].activities||{})[a[6]];if(act&&act.kind&&act.kind!=='worksheet'&&window.renderActivity){window.renderActivity(dock,act,()=>{state.done.add(a[2])});let fc=document.querySelector('#check');if(fc)fc.style.display='none'}else{dock.innerHTML='<b>Type your answers</b><small>Match each box to the question number.</small>';let __n=(a[7]&&a[7]>0)?a[7]:answerSpots(a[2]).length;for(let i=0;i<__n;i++){let label=document.createElement('label'),input=document.createElement('input');label.textContent='Question '+(i+1);input.className='answerDockInput';input.placeholder='Type answer…';input.setAttribute('aria-label','Answer '+(i+1));input.oninput=()=>{state.answer='worksheet answers';let check=document.querySelector('#check');if(check)check.disabled=false};label.appendChild(input);dock.appendChild(label)}};canvas.dataset.answers='ready'}
new MutationObserver(()=>{decorateVocab();decorateAnswerBoxes()}).observe(app,{childList:true,subtree:true});
function render(){if(!Object.keys(units).length){app.innerHTML='<main><header class="hero"><div class="brand">'+(brand.title||'')+'<small>'+(brand.tagline||'')+'</small></div><h1>No units yet</h1><p>Add a unit to data.json, or build one with TeachTown Builder.</p></header></main>';return;}if(!units[state.unit])state.unit=Object.keys(units)[0];if(!weekInfo[state.unit]||!(state.week in weekInfo[state.unit])){let ks=Object.keys(weekInfo[state.unit]||{}).map(Number).sort((a,b)=>a-b);state.week=ks.length?ks[0]:1;}let list=data[state.unit].filter(a=>a[0]===state.week&&(state.subject==='All'||a[1]===state.subject)),info=weekInfo[state.unit][state.week];app.innerHTML=`<main class="${enrHas()?'enriched':''}"><header class="hero"><div class="brand">${brand.title||''}<small>${brand.tagline||''}</small></div><h1>${units[state.unit]&&units[state.unit].hero?units[state.unit].hero.h1:''}</h1><p>${units[state.unit]&&units[state.unit].hero?units[state.unit].hero.p:''}</p></header><section class="switch">${Object.keys(units).map(k=>`<button data-unit="${k}" class="${state.unit===k?'on':''}">${units[k].label||k}</button>`).join('')}</section><nav class="weeks">${Object.keys(weekInfo[state.unit]||{}).map(Number).sort((a,b)=>a-b).map(w=>`<button data-week="${w}" class="${state.week===w?'on':''}">${w===0?'★ Overview':'☆ Week '+w}</button>`).join('')}</nav><section class="layout"><aside class="subjects">${['All','ELA','Math','Science','Social Studies'].map(s=>`<button data-subject="${s}" class="${state.subject===s?'on':''}">${s==='All'?'✨':meta[s][0]} ${s}</button>`).join('')}</aside><div><section class="weekOverview"><h2>${state.week===0?'✨ Unit overview & core materials':'✨ What we’re learning in Week '+state.week}</h2><p class="en-only">${info.learn}${(enrLearn(state.week)&&enrLearn(state.week).audio_en)?audioBtn(enrLearn(state.week).audio_en,'Play English','en-only'):''}</p>${enrLearn(state.week)?`<p class="es es-only">${enrLearn(state.week).es||''}${audioBtn(enrLearn(state.week).audio_es,'Play Spanish','es-only')}</p>`:''}<span class="vocabTitle">WORDS TO KNOW</span><div class="vocabGrid">${info.v.filter(v=>state.subject==='All'||v[2]===state.subject).map(vocabCard).join('')||'<p class="vocabEmpty">No words to know for this section yet.</p>'}</div></section><div class="topline"><h2>Interactive Worksheets</h2><b>${state.done.size} ⭐</b></div><div class="grid">${list.map(a=>`<button class="mission" data-open="${data[state.unit].indexOf(a)}" style="--c:${meta[a[1]][1]}"><small>${meta[a[1]][0]} ${a[1]}</small><h3>${a[2]}</h3><p class="en-only">${a[3]}</p>${enrMission(a[2])?`<p class="es es-only">${enrMission(a[2]).prompt_es||''}</p>`:''}<b>${state.done.has(a[2])?'Completed ★':'Open worksheet →'}</b></button>`).join('')||'<p class="vocabEmpty">No interactive worksheets for this section yet.</p>'}</div></div></section>${state.active!==null?dialog(data[state.unit][state.active]):''}</main>`;bind()}
function dialog(a){let key=state.unit+'|'+a[2],saved=state.notes[key]||[];let act=a[6]?((units[state.unit]&&units[state.unit].activities||{})[a[6]]):null;let hasAct=!!(act&&act.kind&&act.kind!=='worksheet');let pdf=!a[6]?'':hasAct?`<details class="worksheet" open><summary>📄 The worksheet (for reference)</summary><div class="worksheetCanvas"><div class="pdfPages" data-pdf="public/worksheets/intake/${encodeURI(a[6])}"></div></div></details>`:`<details class="worksheet" open><summary>✏️ Work directly on the picture worksheet</summary><div class="worksheetTools"><button data-tool="text" class="${state.tool==='text'?'on':''}">T Type</button><button data-tool="check" class="${state.tool==='check'?'on':''}">✓ Check</button><button data-tool="x" class="${state.tool==='x'?'on':''}">✕ X</button><button data-tool="circle" class="${state.tool==='circle'?'on':''}">◯ Circle</button><button id="undo">↶ Undo</button><button id="clear">Clear</button></div><div class="worksheetHint">Choose a tool, then click exactly where you want to answer. Drag answers to move them.</div><div class="worksheetCanvas"><div class="pdfPages" data-pdf="public/worksheets/intake/${encodeURI(a[6])}"></div><div class="annotationLayer">${saved.map((n,i)=>annotationHTML(n,i)).join('')}</div></div></details>`;let control=pdf?'':a[4]==='choice'?`<div class="choices">${a[5].map(x=>`<button data-answer="${x}">${x}</button>`).join('')}</div>`:a[4]==='type'?`<input class="answer" id="answer" placeholder="Type your answer here…">`:`<div class="cards">${a[5].map(x=>`<button draggable="true" data-card="${x}">${x}</button>`).join('')}</div><div class="drop" id="drop">Drop cards here</div>`;return `<div class="overlay"><section class="dialog"><button class="close">×</button><small>${meta[a[1]][0]} ${a[1]}</small><h2>${a[2]}</h2><p class="prompt en-only">${a[3]}${(enrMission(a[2])&&enrMission(a[2]).audio_en)?audioBtn(enrMission(a[2]).audio_en,'Play English','en-only'):''}</p>${enrMission(a[2])?`<p class="prompt es es-only">${enrMission(a[2]).prompt_es||''}${audioBtn(enrMission(a[2]).audio_es,'Play Spanish','es-only')}</p>`:''}${pdf}${control}<div class="footer"><span id="note">${pdf?(hasAct?'Do the activity on the right, then check your work.':'Answer directly on the page.'):'Take your time. You’ve got this!'}</span><button id="check" ${(state.answer||saved.length)?'':'disabled'}>Check my work ★</button></div></section></div>`}
function annotationHTML(n,i){if(n.type==='text')return `<input class="annotation" data-note="${i}" style="left:${n.x}%;top:${n.y}%" value="${n.value||''}" placeholder="Type…">`;let s=n.type==='check'?'✓':n.type==='x'?'✕':'○';return `<button class="annotation mark ${n.type==='circle'?'circle':''}" data-note="${i}" style="left:${n.x}%;top:${n.y}%">${s}</button>`}
function bind(){document.querySelectorAll('.audioBtn[data-audio]').forEach(b=>b.onclick=(ev)=>{ev.stopPropagation();ttPlay(b.dataset.audio)});document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{state.unit=b.dataset.unit;state.week=1;state.subject='All';render()});document.querySelectorAll('[data-week]').forEach(b=>b.onclick=()=>{state.week=+b.dataset.week;render()});document.querySelectorAll('[data-subject]').forEach(b=>b.onclick=()=>{state.subject=b.dataset.subject;render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{state.active=+b.dataset.open;state.answer='';render()});let c=document.querySelector('.close');if(c)c.onclick=()=>{state.active=null;render()};document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{state.answer=b.dataset.answer;document.querySelectorAll('[data-answer]').forEach(x=>x.classList.remove('pick'));b.classList.add('pick');document.querySelector('#check').disabled=false});let input=document.querySelector('#answer');if(input)input.oninput=e=>{state.answer=e.target.value;document.querySelector('#check').disabled=!state.answer};document.querySelectorAll('[data-card]').forEach(b=>{b.ondragstart=e=>e.dataTransfer.setData('text',b.dataset.card);b.onclick=()=>addCard(b.dataset.card)});let drop=document.querySelector('#drop');if(drop){drop.ondragover=e=>e.preventDefault();drop.ondrop=e=>{e.preventDefault();addCard(e.dataTransfer.getData('text'))}}let check=document.querySelector('#check');if(check)check.onclick=()=>{let a=data[state.unit][state.active];state.done.add(a[2]);document.querySelector('#note').textContent='Great thinking! You earned a star ⭐';check.textContent='Mission complete!'};bindAnnotations()}function bindAnnotations(){let a=state.active===null?null:data[state.unit][state.active];if(!a)return;let key=state.unit+'|'+a[2];state.notes[key]??=[];document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{state.tool=b.dataset.tool;render()});let layer=document.querySelector('.annotationLayer');if(layer)layer.onclick=e=>{if(e.target!==layer)return;let r=layer.getBoundingClientRect(),n={type:state.tool,x:(e.clientX-r.left)/r.width*100,y:(e.clientY-r.top)/r.height*100,value:''};state.notes[key].push(n);state.answer='annotated';render()};document.querySelectorAll('[data-note]').forEach(el=>{let i=+el.dataset.note;if(el.tagName==='INPUT')el.oninput=e=>state.notes[key][i].value=e.target.value;el.draggable=true;el.ondragstart=e=>e.dataTransfer.setData('note',i)});if(layer){layer.ondragover=e=>e.preventDefault();layer.ondrop=e=>{e.preventDefault();let i=+e.dataTransfer.getData('note'),r=layer.getBoundingClientRect();state.notes[key][i].x=(e.clientX-r.left)/r.width*100;state.notes[key][i].y=(e.clientY-r.top)/r.height*100;render()}}let u=document.querySelector('#undo');if(u)u.onclick=()=>{state.notes[key].pop();render()};let cl=document.querySelector('#clear');if(cl)cl.onclick=()=>{state.notes[key]=[];state.answer='';render()}}function addCard(v){state.answer=state.answer?state.answer+', '+v:v;let d=document.querySelector('#drop');d.textContent=state.answer;document.querySelector('#check').disabled=false}function applyData(d){if(d){meta=d.meta||meta;vocabIcons=d.vocabIcons||vocabIcons;brand=d.brand||brand;units=d.units||{};}weekInfo={};data={};for(const k in units){weekInfo[k]=units[k].weekInfo;data[k]=units[k].missions;}if(!units[state.unit])state.unit=Object.keys(units)[0]||state.unit;}
Promise.all([fetch('data.json').then(r=>r.ok?r.json():null).catch(()=>null),fetch('enrichment.json').then(r=>r.ok?r.json():null).catch(()=>null)]).then(([d,e])=>{applyData(d);if(e)ENR={vocab:e.vocab||{},learn:e.learn||{},missions:e.missions||{}};render();});
</script></body></html>
