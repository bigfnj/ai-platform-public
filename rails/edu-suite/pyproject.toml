[project]
name = "edu-suite"
version = "0.1.0"
description = "Local-first bilingual special-education instructional material tools"
requires-python = ">=3.11,<3.12"

[tool.uv.workspace]
# apps/teachtown is a JS app and is not a uv workspace member.
members = ["packages/edu-media-core", "apps/slide-audio", "apps/cvc-worksheets", "apps/dashboard"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
