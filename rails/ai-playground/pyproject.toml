[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-playground"
version = "0.1.0"
description = "AI Playground: a multi-demo platform rail for showcasing AI projects on the shared GPU broker. First demo: RAG-over-documents with cited, token-streamed answers and a live local <-> NVIDIA-NIM generation toggle."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "bigfnj" }]
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",   # [standard] pulls websockets for the /ws/rag streaming path
  "python-multipart>=0.0.9",   # multipart form uploads (user documents)
  "httpx>=0.27",               # thin broker client (POST /v1/chat, /v1/chat/stream, /v1/embed)
  "numpy>=1.26",               # cosine retrieval over the embedded corpus
  "openai>=1.30",              # external NVIDIA NIM client for the generation toggle
  "tzdata>=2024.1",            # IANA tz db (slim image has none)
  # Embedding Lab (bench) — the CPU/ONNX "beside-the-exe" provider. Torch-free: onnxruntime
  # runs the int8 graphs on CPU, tokenizers handles WordPiece/SentencePiece, hub fetches assets.
  "onnxruntime>=1.19",         # CPU inference for the int8 ONNX embedders
  "tokenizers>=0.20",          # model tokenizer.json (WordPiece + SentencePiece)
  "huggingface_hub>=0.24",     # fetch onnx model assets into the models volume
]

# No console script: the app runs as `uvicorn --factory ai_playground.api:create_api`.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
