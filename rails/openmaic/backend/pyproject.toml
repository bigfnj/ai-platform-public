[project]
name = "openmaic-rail"
version = "0.1.0"
description = "OpenMAIC — an interactive-classroom rail wrapping the upstream OpenMAIC courseware app."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["openmaic_app*"]
