[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recipe-book"
version = "0.1.0"
description = "Recipe Book — a Kitchen + Bar recipe library (835 cards) parsed into SQLite, with meal planning, shopping lists, pantry / bar-inventory matching, per-recipe SDXL icons, and broker-backed LLM help. Platform rail module."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "bigfnj" }]
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",  # multipart form uploads (recipe import)
  "httpx>=0.27",              # thin broker client (POST /v1/chat, /v1/embed, image gen)
  "cryptography>=42",         # Fernet: encrypt Google refresh tokens at rest (recipe_book.crypto)
  # Phase 2 recipe import (extraction). All pure-python / manylinux wheels, torch-free.
  "PyMuPDF>=1.24",            # PDF text + render scanned pages to images for vision
  "python-docx>=1.1",         # .docx text extraction
  "trafilatura>=1.9",         # fetch + strip a recipe URL to clean article text
  "Pillow>=10.3",             # normalize/resize uploaded photos before vision
]

# No console script: the app runs as `uvicorn --factory recipe_book.api:create_api`.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
