[project]
name = "terminal-fun"
version = "0.1.0"
description = "Fun in the Term — a platform rail of local terminal games/toys over a browser terminal."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["terminal_fun_app*"]
