[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bouquet"
version = "0.1.0"
description = "Bouquet Builder: hand it a bouquet photo and get back a full per-flower report — identify every flower through the platform broker's vision model, pull each flower's profile from a florist-grade knowledge base, and write an expert analysis or Frenchies-Flowers customer copy. Platform rail module."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "bigfnj" }]
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",  # multipart form uploads (the bouquet photo)
  "httpx>=0.27",              # thin broker client (POST /v1/chat)
  "pillow>=10.2",             # downscale/re-encode the uploaded photo for the vision model
  "tzdata>=2024.1",           # IANA tz db for the weekly cleanup schedule (slim image has none)
  "numpy>=1.26",              # nearest-neighbour over the baked retrieval-grounding index
]

# No console script: the app runs as `uvicorn --factory bouquet.api:create_api`.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
