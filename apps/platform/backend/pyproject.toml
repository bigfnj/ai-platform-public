[project]
name = "platform-gateway-backend"
version = "0.1.0"
description = "Platform gateway: serves the unified shell SPA, proxies app backends, exposes broker/GPU status."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "platform-core",
    # auth / multi-tenant
    "sqlalchemy>=2.0",
    "pwdlib[argon2]>=0.2.1",
    # Imported by name at module scope, and present only because something else pulls them in:
    # anyio (the body ceiling's shielded cancel scope) through Starlette, which asks for
    # anyio>=4.0,<5; starlette (ASGI types, Headers) through FastAPI, whose 0.111 floor is
    # starlette 0.37.2; pydantic through FastAPI and pydantic-settings through platform-core (the
    # floors the Dockerfiles already install); websockets (the WS bridge's asyncio client, 13+)
    # through uvicorn[standard]. tests/test_gateway_declared_dependencies.py holds this list to
    # the imports, and deploy/Dockerfile.gateway(.bundled) to this list.
    "anyio>=4.0",
    "starlette>=0.37.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "websockets>=13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platform_gateway_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Local test runs resolve the app + shared core from the tree (the container pip-installs them).
pythonpath = [".", "../../../packages/platform_core"]
# The proxy and the WS bridge are async, so their tests are too. Matches services/broker.
asyncio_mode = "auto"
