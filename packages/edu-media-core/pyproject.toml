[project]
name = "edu-media-core"
version = "0.1.0"
description = "Shared local-first media engine for edu-suite: Ollama translation, XTTS audio, SDXL images, PDF ingest + slide classification"
requires-python = ">=3.11,<3.12"
# ⚠ These pins are the edu-suite uv WORKSPACE's (that rail's uv.lock locks them), not the
# broker's. The broker runs this package's media code in venvs set up on their own and wired
# in by deploy/install-services.ps1 (<work root>\venvs\{media,tts,kokoro}-venv, which it checks
# for and warns about): BROKER_MEDIA_PYTHON (transformers 5.x, diffusers) and
# BROKER_TTS_PYTHON (coqui-tts, transformers <5); services/broker/.env.example explains the
# split. That is why the broker's two GPU stacks differ from what is pinned here. Do NOT `uv sync` this file into a broker venv: it would build a
# third GPU stack beside the two that work. Changing a pin here means relocking edu-suite.
dependencies = [
    "ollama>=0.6.2",
    "pdfplumber>=0.11.9",
    "pymupdf>=1.27.2.3",
    "pytesseract>=0.3.13",
    "numpy>=1.26",
    "soundfile>=0.12.0",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "transformers==4.44.2",
    "tts>=0.22.0",
    # Capped: diffusers >=0.32 imports pipelines needing a newer transformers
    # (Dinov2WithRegistersConfig), but XTTS v2 pins transformers==4.44.2.
    "diffusers>=0.31.0,<0.32",
    "accelerate>=1.0.0",
    "ddgs>=9.0.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edu_media_core"]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
