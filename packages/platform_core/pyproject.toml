[project]
name = "platform-core"
version = "0.0.1"
description = "Shared core for the self-hosted AI platform: config base + broker client."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Apps that need a database depend on platform-core[db]; keeps SQLAlchemy off the
# core so DB-less apps (e.g. the console) stay lean.
db = [
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platform_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
